<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>e장부 PC 프로그램 받기</title>
<!-- 짧은 주소(klubiz.github.io/ejangbu-web/pc) → 자동 업데이트가 쓰는 최신 설치 파일. 버전이 바뀌어도 주소는 그대로. -->
<meta http-equiv="refresh" content="1;url=https://kyfukwytqiohatedftwm.supabase.co/storage/v1/object/public/releases/latest/trade-manager-setup.exe">
<style>
  :root { --bg:#f5f5f7; --card:#fff; --line:#e5e5ea; --ink:#1d1d1f; --muted:#65656a; --main:#007aff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101013; --card:#1b1b21; --line:#26262e; --ink:#f9fafb; --muted:#8b95a1; --main:#3182f6; }
  }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  main { max-width:560px; margin:48px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 20px; line-height:1.6; }
  a.btn { display:block; text-align:center; background:var(--main); color:#fff; text-decoration:none; font-weight:600; border-radius:12px; height:52px; line-height:52px; font-size:17px; }
  ol { margin:24px 0 0; padding-left:20px; line-height:1.8; }
  b { color:var(--ink); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>e장부 PC 프로그램</h1>
    <p>설치 파일(trade-manager-setup.exe, 약 28MB)이 곧 저절로 받아집니다. 안 받아지면 아래 단추를 누르세요.</p>
    <a class="btn" href="https://kyfukwytqiohatedftwm.supabase.co/storage/v1/object/public/releases/latest/trade-manager-setup.exe">설치 파일 받기</a>
    <ol>
      <li>브라우저가 "일반적으로 다운로드되지 않는 파일"이라고 하면 <b>유지</b>를 누르세요.</li>
      <li>받은 파일을 실행하면 "Windows의 PC 보호" 창이 뜹니다. <b>추가 정보 → 실행</b>을 누르세요.</li>
      <li>설치가 끝나면 매장과 같은 계정으로 로그인하세요. 처음에는 자료를 받아 오느라 몇 분 걸립니다.</li>
    </ol>
  </div>
</main>
</body>
</html>
